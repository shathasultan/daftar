<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر الفروع</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الفروع">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="login" id="login" hidden>
  <form class="login-box" id="loginForm">
    <img class="app-icon" src="icons/icon-192.png" alt="">
    <div><h1 class="large">أهلاً أحمد</h1><p class="sub">سجّل دخولك عشان تشوف فروعك</p></div>
    <div class="list">
      <div class="row field-row"><label for="email">الإيميل</label><input id="email" type="email" autocomplete="username" dir="ltr" required></div>
      <div class="row field-row"><label for="password">كلمة السر</label><input id="password" type="password" autocomplete="current-password" dir="ltr" required></div>
    </div>
    <div class="login-err" id="loginErr" hidden></div>
    <button class="btn" id="loginBtn" type="submit">دخول</button>
  </form>
</main>

<div id="app" hidden>
  <header class="nav" id="nav">
    <div class="nav-in">
      <div class="nav-start" id="navStart"></div>
      <div class="nav-title" id="navTitle"></div>
      <div class="nav-end" id="navEnd"></div>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main class="page" id="page"></main>
  <div class="totalbar" id="totalBar" hidden></div>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="aiSheet" hidden aria-label="المساعد الذكي">
  <div class="grabber"></div>
  <div class="sheet-head"><span></span><h2>المساعد الذكي</h2><button class="nav-btn" type="button" data-close-sheet>تم</button></div>
  <div class="ai-msgs" id="aiMsgs" aria-live="polite"></div>
  <div class="ai-sugg" id="aiSugg"></div>
  <form class="ai-form" id="aiForm">
    <input id="aiInput" autocomplete="off" placeholder="اسأل عن أي فرع أو يوم…" aria-label="سؤالك للمساعد">
    <button id="aiSend" type="submit" aria-label="إرسال"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
</section>
<section class="sheet small" id="editSheet" hidden aria-label="تعديل الفروع"></section>
<section class="sheet small" id="importSheet" hidden aria-label="استيراد البيانات"></section>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
