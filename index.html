<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر الفروع</title>
<meta name="theme-color" content="#24306b">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الفروع">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: ledger desk — month strip on top, calendar as the main sheet, branch totals pinned beside it, yearly report below */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f4f6fa; --ink:#141b2e; --muted:#5f6a84; --line:#dce1ea;
  --primary:#24306b; --primary-ink:#ffffff; --accent:#d98a1c; --heat:#f2a93b; --accent-ink:#8a5200;
  --good:#18855b; --bad:#c2413a; --shadow:0 1px 2px rgba(20,27,46,.06),0 8px 24px -12px rgba(20,27,46,.18);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1019; --surface:#151b28; --surface-2:#1b2333; --ink:#e7ebf4; --muted:#97a1b8; --line:#283146;
  --primary:#a8b6ff; --primary-ink:#0c1019; --accent:#f0ae45; --heat:#e59a2c; --accent-ink:#f6c16e;
  --good:#45c08b; --bad:#ef7a72; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1019; --surface:#151b28; --surface-2:#1b2333; --ink:#e7ebf4; --muted:#97a1b8; --line:#283146;
  --primary:#a8b6ff; --primary-ink:#0c1019; --accent:#f0ae45; --heat:#e59a2c; --accent-ink:#f6c16e;
  --good:#45c08b; --bad:#ef7a72; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mval,.big,.bv,.dv,td,th{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.cur{font-size:.62em;color:var(--muted);font-weight:500;margin-inline-start:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:22px;font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:13px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.yearnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.yearnav button{border:0;background:transparent;width:34px;height:34px;border-radius:999px;font-size:20px;line-height:1;display:grid;place-items:center}
.yearnav button:hover{background:var(--surface-2)}
.yearnav span{font-family:var(--f-display);font-weight:600;font-size:17px;min-width:58px;text-align:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08);background:var(--primary)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 12px;font-size:13px}
.banner{background:color-mix(in oklab,var(--accent) 16%,var(--surface));border:1px solid color-mix(in oklab,var(--accent) 40%,var(--line));color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13.5px}

/* months strip */
.months-wrap{overflow-x:auto;scrollbar-width:thin;margin-inline:-4px;padding:4px}
.months{display:grid;grid-template-columns:repeat(12,minmax(96px,1fr));gap:8px;min-width:max-content}
.mtile{position:relative;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .15s}
.mtile:hover{transform:translateY(-1px);border-color:color-mix(in oklab,var(--primary) 40%,var(--line))}
.mtile .mname{font-family:var(--f-display);font-weight:600;font-size:15px}
.mtile .mnum{position:absolute;top:9px;inset-inline-end:10px;font-size:11px;color:var(--muted)}
.mtile .mval{font-size:13px;color:var(--muted)}
.mtile .mbar{height:4px;border-radius:4px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.mtile .mbar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.mtile.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.mtile.on .mval,.mtile.on .mnum{color:color-mix(in oklab,var(--primary-ink) 75%,transparent)}
.mtile.on .mbar{background:color-mix(in oklab,var(--primary-ink) 22%,transparent)}
.mtile.now:not(.on)::after{content:"";position:absolute;top:12px;inset-inline-end:30px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* main grid */
.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:960px){.main-grid{grid-template-columns:minmax(0,1fr)}}
.cal-card{padding:18px}
.cal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cal-head h2{font-size:24px;font-weight:700}
.hijri{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:13px;font-weight:500}
.chip .sw{width:10px;height:10px}
.chip button{border:0;background:transparent;color:var(--muted);padding:0 2px;font-size:15px;line-height:1}
.mnav{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.dow,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{margin-bottom:6px}
.dow span{font-size:12px;color:var(--muted);text-align:center;font-weight:500}
.day{position:relative;min-height:88px;border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:start;display:flex;flex-direction:column;gap:2px;
  background:color-mix(in oklab,var(--heat) calc(var(--h,0) * 1%),var(--surface));transition:transform .12s,border-color .12s,box-shadow .12s}
.day:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:var(--shadow)}
.day.blank{visibility:hidden}
.day.wknd{background:color-mix(in oklab,var(--heat) calc(var(--h,0) * 1%),var(--surface-2))}
.day.future{opacity:.62}
.day.today{border:2px solid var(--primary);padding:6px 7px}
.day .top-row{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.day .dn{font-family:var(--f-display);font-weight:600;font-size:16px}
.day .hj{font-size:10.5px;color:var(--muted)}
.day .dv{margin-top:auto;font-weight:600;font-size:13.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .dots{display:flex;gap:3px;flex-wrap:wrap;min-height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.day .add{margin-top:auto;font-size:12px;color:var(--muted);opacity:0;transition:opacity .15s}
.day:hover .add{opacity:1}
@media (max-width:620px){
  .cal-card{padding:12px}
  .dow,.cal{gap:3px}
  .day{min-height:62px;padding:5px;border-radius:8px}
  .day.today{padding:4px}
  .day .dn{font-size:13px}
  .day .hj,.day .add{display:none}
  .day .dv{font-size:10.5px}
  .day .dots i{width:4px;height:4px}
}

/* side */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.total-card{padding:18px;background:var(--primary);color:var(--primary-ink);border-color:transparent}
.total-card .eyebrow{color:color-mix(in oklab,var(--primary-ink) 72%,transparent)}
.total-card .big{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1.15;margin:6px 0 4px;word-break:break-word}
.total-card .cur{color:color-mix(in oklab,var(--primary-ink) 70%,transparent)}
.delta{font-size:13px;display:inline-flex;gap:4px;align-items:center;background:color-mix(in oklab,var(--primary-ink) 14%,transparent);padding:2px 9px;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 0;padding-top:14px;border-top:1px solid color-mix(in oklab,var(--primary-ink) 20%,transparent)}
.stats div{min-width:0}
.stats dt{font-size:11.5px;color:color-mix(in oklab,var(--primary-ink) 70%,transparent)}
.stats dd{margin:0;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.blist{padding:14px}
.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-inline:4px}
.side-head h3{font-size:16px}
.link{border:0;background:transparent;color:var(--primary);font-weight:600;font-size:13px}
.brow{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:10px;row-gap:6px;padding:10px;border-radius:10px;border:1px solid transparent;background:transparent;text-align:start}
.brow:hover{background:var(--surface-2)}
.brow.on{background:var(--surface-2);border-color:var(--line)}
.sw{width:12px;height:12px;border-radius:4px;background:var(--c,var(--primary));flex:none;display:inline-block}
.sw.all{background:conic-gradient(#3b6fe0 0 25%,#e0662f 0 50%,#1f9d74 0 75%,#b04fc9 0)}
.bmeta{display:flex;flex-direction:column;min-width:0}
.bn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsub{font-size:12px;color:var(--muted)}
.bv{font-weight:600;font-family:var(--f-display)}
.bshare{grid-column:2 / 4;height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.brow.on .bshare,.brow:hover .bshare{background:var(--bg)}
.bshare i{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .4s}
.empty{padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:17px}

/* year */
.year{padding:20px}
.year-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.year-head h2{font-size:22px}
.ytotal{font-size:13px;color:var(--muted)}
.ytotal strong{display:block;font-family:var(--f-display);font-size:24px;color:var(--ink)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart .bar{cursor:pointer;transition:opacity .15s}
.chart .faded{opacity:.22}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:900px}
th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--surface-2)}
tbody tr:hover td{background:var(--surface-2)}
td.sel,th.sel{background:color-mix(in oklab,var(--accent) 12%,var(--surface))}
tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
td.tot,th.tot{font-weight:700}
td.zero{color:var(--muted)}

/* dialogs */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(10,14,24,.5);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.4}to{transform:none;opacity:1}}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 32px)}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dlg-head h3{font-size:20px}
.dlg-body{padding:14px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.dlg-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--surface-2);border-radius:0 0 18px 18px}
.erow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,150px);align-items:center;gap:6px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.erow:focus-within{border-color:var(--c)}
.erow .en{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;font-family:var(--f-display);font-weight:600;font-size:17px;text-align:end;direction:ltr}
.erow input.err{border-color:var(--bad)}
.erow .emt{grid-column:2 / 4;font-size:12.5px;color:var(--muted)}
.erow .emt b{color:var(--accent-ink);font-weight:700}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sums div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.sums span{font-size:12px;color:var(--muted);display:block}
.sums b{font-family:var(--f-display);font-size:19px;white-space:nowrap}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.brm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.brm input,.addrow input,.field select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px}
.swbtn{width:30px;height:30px;border-radius:9px;border:2px solid var(--surface);outline:1px solid var(--line);background:var(--c)}
.confirm{grid-column:1 / -1;font-size:13px;background:color-mix(in oklab,var(--bad) 10%,var(--surface));border:1px solid color-mix(in oklab,var(--bad) 35%,var(--line));border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.addrow{display:flex;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field select{color:var(--ink)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);box-shadow:var(--shadow);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:min(400px,100%);padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.login-card .mark{width:56px;height:56px;border-radius:16px}
.login-card h1{font-size:24px}
.login-card p{margin:0;color:var(--muted);font-size:14px}
.login-card label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.login-card input{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;font-size:16px;color:var(--ink);direction:ltr;text-align:start}
.login-card .btn{justify-content:center;padding:12px}
.login-err{color:var(--bad);font-size:13.5px}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.ai-fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:calc(18px + env(safe-area-inset-left,0px));z-index:15;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 18px;font-weight:600;background:var(--accent);color:#1b1206;box-shadow:0 10px 30px -8px color-mix(in oklab,var(--accent) 70%,transparent);transition:transform .15s}
.ai-fab:hover{transform:translateY(-2px)}
.ai-panel{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:calc(18px + env(safe-area-inset-left,0px));z-index:16;width:min(390px,calc(100vw - 36px));height:min(600px,calc(100dvh - 120px));display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:pop .18s ease-out}
.ai-panel[hidden]{display:none!important}
.ai-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ai-head b{font-family:var(--f-display);font-size:16px;display:block}
.ai-head span{font-size:12px;color:var(--muted)}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere}
.ai-msg.bot{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-start-start-radius:4px}
.ai-msg.me{background:var(--primary);color:var(--primary-ink);align-self:flex-end;border-start-end-radius:4px}
.ai-msg ul{margin:4px 0;padding-inline-start:18px}
.ai-dots{display:inline-flex;gap:4px;padding:4px 0}
.ai-dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.ai-dots i:nth-child(2){animation-delay:.15s}.ai-dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.ai-sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.ai-sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px}
.ai-sugg button:hover{border-color:var(--accent)}
.ai-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface-2)}
.ai-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;font-size:16px;color:var(--ink)}
@media (max-width:620px){
  .ai-panel{left:0;right:0;bottom:0;width:100%;height:82dvh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .ai-fab{padding:11px 15px}
  .wrap{padding-bottom:90px}
}
</style>
</head>
<body>
<main class="login" id="login" hidden>
  <form class="card login-card" id="loginForm">
    <div class="mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4M8 14.5l2.5 2.5 5-5"/></svg></div>
    <div><h1>دفتر الفروع</h1><p>سجّل دخولك عشان تشوف دخل فروعك.</p></div>
    <label for="email">الإيميل<input id="email" type="email" autocomplete="username" required></label>
    <label for="password">كلمة السر<input id="password" type="password" autocomplete="current-password" required></label>
    <div class="login-err" id="loginErr" hidden></div>
    <button class="btn primary" id="loginBtn" type="submit">دخول</button>
  </form>
</main>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4M8 14.5l2.5 2.5 5-5"/></svg>
      </div>
      <div><h1>دفتر الفروع</h1><p>الدخل اليومي لكل فرع وأرباح كل شهر</p></div>
    </div>
    <div class="top-actions">
      <div class="yearnav" role="group" aria-label="السنة">
        <button id="yPrev" aria-label="السنة السابقة">›</button>
        <span id="yLabel" class="num"></span>
        <button id="yNext" aria-label="السنة التالية">‹</button>
      </div>
      <button class="btn" id="manageBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg>الفروع</button>
      <button class="btn" id="logoutBtn" aria-label="تسجيل الخروج">خروج</button>
      <button class="btn primary" id="todayBtn">+ دخل اليوم</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="months-wrap"><nav class="months" id="months" aria-label="أشهر السنة"></nav></div>
  <section class="main-grid">
    <div class="card cal-card">
      <div class="cal-head">
        <div><h2 id="calTitle"></h2><div class="hijri" id="calHijri"></div></div>
        <div id="filterChip"></div>
        <div class="mnav">
          <button class="icon-btn" id="mPrev" aria-label="الشهر السابق">›</button>
          <button class="icon-btn" id="mNext" aria-label="الشهر التالي">‹</button>
        </div>
      </div>
      <div class="dow" id="dow"></div>
      <div class="cal" id="cal"></div>
    </div>
    <aside class="side">
      <div class="card total-card" id="totalCard"></div>
      <div class="card blist" id="branchList"></div>
    </aside>
  </section>
  <section class="card year" id="yearSec"></section>
  <button class="ai-fab" id="aiFab" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/><path d="M19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z" opacity=".7"/></svg>اسأل المساعد</button>
  <section class="ai-panel card" id="aiPanel" hidden aria-label="المساعد الذكي">
    <header class="ai-head"><div><b>المساعد الذكي</b><span>يجاوبك من أرقام الدفتر</span></div><button type="button" class="icon-btn" id="aiClose" aria-label="إغلاق المساعد">×</button></header>
    <div class="ai-msgs" id="aiMsgs" aria-live="polite"></div>
    <div class="ai-sugg" id="aiSugg"></div>
    <form class="ai-form" id="aiForm"><input id="aiInput" autocomplete="off" placeholder="مثلاً: كم دخل فرع العليا هالأسبوع؟" aria-label="سؤالك للمساعد"><button class="btn primary" id="aiSend" type="submit">إرسال</button></form>
  </section>
</div>
<dialog id="dayDlg"></dialog>
<dialog id="brDlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
